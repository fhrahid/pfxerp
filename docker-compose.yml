services:
  postgres:
    image: postgres:16-alpine
    container_name: pointfex-postgres
    restart: always
    environment:
      POSTGRES_DB: pointfex_db
      POSTGRES_USER: pointfex_admin
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - pointfex-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pointfex_admin -d pointfex_db"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pointfex-api
    restart: always
    environment:
      DATABASE_URL: "postgresql://pointfex_admin:${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}@postgres:5432/pointfex_db?schema=public&connection_limit=25"
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET in the deployment environment}
      LEDGER_SECRET_KEY: ${LEDGER_SECRET_KEY:?Set a separate strong LEDGER_SECRET_KEY in the deployment environment}
      INITIAL_CEO_EMAIL: ${INITIAL_CEO_EMAIL:-noor@seu.edu.bd}
      INITIAL_CEO_PASSWORD: ${INITIAL_CEO_PASSWORD:?Set INITIAL_CEO_PASSWORD in the deployment environment}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pointfex-internal

volumes:
  pgdata:

networks:
  pointfex-internal:
    driver: bridge
